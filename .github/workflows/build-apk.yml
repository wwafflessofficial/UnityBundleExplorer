```yaml
name: Build Unity Bundle Explorer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
        run: |
          mkdir extracted
          found=false

          for file in *.zip; do
            if [ -f "$file" ]; then
              unzip -o "$file" -d extracted
              found=true
            fi
          done

          if [ "$found" = false ]; then
            echo "No ZIP archive found in repository root."
            exit 1
          fi

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle in extracted project."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityBundleExplorer-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
```
