name: Build Unity Bundle Explorer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
        run: |
          mkdir -p extracted

          find . -maxdepth 3 -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tar' \) \
            ! -path './.git/*' \
            -print

          ARCHIVE=$(find . -maxdepth 3 -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tar' \) \
            ! -path './.git/*' | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "No project archive found."
            exit 1
          fi

          case "$ARCHIVE" in
            *.zip) unzip -o "$ARCHIVE" -d extracted ;;
            *.tar.gz) tar -xzf "$ARCHIVE" -C extracted ;;
            *.tar) tar -xf "$ARCHIVE" -C extracted ;;
          esac

      - name: Find Android project
        id: project
        run: |
          FILE=$(find extracted -name settings.gradle -print -quit)

          if [ -z "$FILE" ]; then
            echo "settings.gradle not found."
            exit 1
          fi

          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityBundleExplorer-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
